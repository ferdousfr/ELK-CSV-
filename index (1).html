
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELK Smart DLR Report Generator</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
*{box-sizing:border-box}
body{
  margin:0;padding:20px;background:#f1f5f9;
  font-family:Arial,sans-serif;color:#172033
}
.container{max-width:1100px;margin:auto}
header{
  background:linear-gradient(120deg,#102b50,#1769aa);
  color:white;padding:25px;border-radius:14px;margin-bottom:20px
}
header h1{margin:0 0 8px;font-size:25px}
header p{margin:0;color:#dbeafe}
.uploads{display:grid;grid-template-columns:1fr 1fr;gap:18px}
.card{
  background:white;padding:20px;border-radius:12px;
  box-shadow:0 3px 12px #0000000d;margin-bottom:18px
}
.card h2{margin-top:0;font-size:19px}
input[type=file]{
  width:100%;padding:12px;border:1px dashed #94a3b8;
  border-radius:8px;background:#f8fafc
}
button{
  border:0;border-radius:7px;padding:11px 16px;
  cursor:pointer;font-weight:bold;margin:5px 4px 5px 0;
  background:#1769aa;color:white
}
button:hover{opacity:.88}
.green{background:#15803d}
.dark{background:#334155}
.report{background:white;padding:25px;border-radius:10px;margin-top:20px}
.report-head{
  text-align:center;border-bottom:2px solid #1769aa;
  padding-bottom:15px;margin-bottom:18px
}
.report-head h2{color:#174d7a;margin:0 0 10px}
.meta{display:flex;justify-content:space-between;flex-wrap:wrap;gap:10px}
.stats{display:flex;gap:12px;margin:18px 0;flex-wrap:wrap}
.stat{
  background:#eff6ff;border-radius:8px;padding:14px;
  flex:1;min-width:130px
}
.stat strong{display:block;font-size:21px;color:#174d7a;margin-top:5px}
table{width:100%;border-collapse:collapse;margin-top:15px}
th,td{padding:11px;border:1px solid #dbe3ec;text-align:left}
th{background:#174d7a;color:white}
tr:nth-child(even){background:#f8fafc}
.actions{margin-top:15px}
.note{color:#64748b;font-size:13px}
@media(max-width:700px){
 .uploads{grid-template-columns:1fr}
 body{padding:10px}
 .report{padding:12px}
}
</style>
</head>

<body>
<div class="container">

<header>
<h1>ELK SMART DLR REPORT GENERATOR</h1>
<p>Separate MNO & IPTSP Reports | CSV | PDF | PNG</p>
</header>

<div class="uploads">
  <div class="card">
    <h2>📊 DLR MNO Report</h2>
    <input type="file" id="mnoFile" accept=".csv">
    <button onclick="generate('MNO')">Generate MNO Report</button>
  </div>

  <div class="card">
    <h2>📊 DLR IPTSP Report</h2>
    <input type="file" id="iptspFile" accept=".csv">
    <button onclick="generate('IPTSP')">Generate IPTSP Report</button>
  </div>
</div>

<div id="output"></div>

</div>

<script>
let reports = {};

function getField(row, names) {
  const keys = Object.keys(row);
  for (const name of names) {
    const key = keys.find(k => k.trim().toLowerCase() === name.toLowerCase());
    if (key && row[key] !== undefined) return String(row[key]).trim();
  }
  return "";
}

function parseMessage(message) {
  let status = "";
  let description = "";

  const s = message.match(/["']?statusCode["']?\s*[:=]\s*["']?(\d+)/i);
  const d = message.match(/["']?errordescription["']?\s*[:=]\s*["']([^"']*)/i);

  if (s) status = s[1];
  if (d) description = d[1];

  if (!status) {
    const fallback = message.match(/\b(1000|1002|1005|1013|1014|1015|1017|1020|1052|1429)\b/);
    if (fallback) status = fallback[1];
  }

  if (!description) {
    description = message || "Unknown";
  }

  return {status:status || "Unknown", description:description || "Unknown"};
}

function generate(type) {
  const input = document.getElementById(type === "MNO" ? "mnoFile" : "iptspFile");
  const file = input.files[0];

  if (!file) {
    alert("Please select the " + type + " CSV file first.");
    return;
  }

  Papa.parse(file, {
    header:true,
    skipEmptyLines:true,
    complete:function(result) {
      const rows = result.data;
      if (!rows.length) {
        alert("CSV file is empty.");
        return;
      }

      const counts = {};
      let timestamps = [];

      rows.forEach(row => {
        const message = getField(row, ["message","Message","log","description"]);
        const parsed = parseMessage(message);

        const directStatus = getField(row, ["statusCode","status_code","status code"]);
        const directDescription = getField(row, ["errorDescription","errordescription","error_description"]);

        const status = directStatus || parsed.status;
        const description = directDescription || parsed.description;

        const key = status + "||" + description;
        counts[key] = (counts[key] || 0) + 1;

        const timestamp = getField(row, ["@timestamp","timestamp","time"]);
        if (timestamp) {
          const date = new Date(timestamp);
          if (!isNaN(date.getTime())) timestamps.push(date);
        }
      });

      const sorted = Object.entries(counts).sort((a,b) => b[1]-a[1]);
      const total = rows.length;
      const generated = new Date().toLocaleString();

      let start = "Not available";
      let end = "Not available";

      if (timestamps.length) {
        timestamps.sort((a,b) => a-b);
        start = timestamps[0].toLocaleString();
        end = timestamps[timestamps.length-1].toLocaleString();
      }

      const report = document.createElement("div");
      report.className = "card";

      const safeName = type === "MNO" ? "DLR MNO" : "DLR IPTSP";

      report.innerHTML = `
        <div class="report" id="report-${type}">
          <div class="report-head">
            <h2>${safeName} REPORT</h2>
            <div class="meta">
              <span><b>Start Time:</b> ${start}</span>
              <span><b>End Time:</b> ${end}</span>
            </div>
            <p><b>Report Generated:</b> ${generated}</p>
            <p class="note">Source File: ${escapeHtml(file.name)}</p>
          </div>

          <div class="stats">
            <div class="stat">Total Records<strong>${total.toLocaleString()}</strong></div>
            <div class="stat">Unique Status<strong>${sorted.length}</strong></div>
          </div>

          <table>
            <thead>
              <tr>
                <th>Status Code</th>
                <th>Error Description</th>
                <th>Count</th>
              </tr>
            </thead>
            <tbody>
              ${sorted.map(item => {
                const parts = item[0].split("||");
                return `<tr>
                  <td>${escapeHtml(parts[0])}</td>
                  <td>${escapeHtml(parts.slice(1).join("||"))}</td>
                  <td>${item[1].toLocaleString()}</td>
                </tr>`;
              }).join("")}
            </tbody>
          </table>
          <p class="note" style="text-align:center;margin-top:20px">
            ELK Smart DLR Report Generator
          </p>
        </div>

        <div class="actions">
          <button class="green" onclick="downloadCSV('${type}')">Download CSV</button>
          <button onclick="downloadPNG('${type}')">Save PNG Image</button>
          <button class="dark" onclick="downloadPDF('${type}')">Save PDF</button>
        </div>
      `;

      document.getElementById("output").prepend(report);
      reports[type] = sorted;
      report.scrollIntoView({behavior:"smooth"});
    },
    error:function() {
      alert("Unable to read CSV file.");
    }
  });
}

function escapeHtml(value) {
  return String(value).replace(/[&<>"']/g, c => ({
    "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"
  }[c]));
}

function downloadCSV(type) {
  if (!reports[type]) return;
  const rows = [["Status Code","Error Description","Count"], ...reports[type].map(item => {
    const p = item[0].split("||");
    return [p[0],p.slice(1).join("||"),item[1]];
  })];

  const csv = rows.map(row => row.map(v => `"${String(v).replace(/"/g,'""')}"`).join(",")).join("\n");
  const blob = new Blob(["\uFEFF"+csv],{type:"text/csv;charset=utf-8"});
  saveBlob(blob, "DLR_"+type+"_Report.csv");
}

function downloadPNG(type) {
  const element = document.getElementById("report-"+type);
  if (!element) return;
  html2canvas(element,{scale:2,backgroundColor:"#ffffff",useCORS:true})
    .then(canvas => {
      canvas.toBlob(blob => saveBlob(blob,"DLR_"+type+"_Report.png"));
    });
}

function downloadPDF(type) {
  const element = document.getElementById("report-"+type);
  if (!element) return;
  const win = window.open("","_blank");
  if (!win) {
    alert("Please allow pop-ups for PDF printing.");
    return;
  }
  win.document.write(`
    <html><head><title>DLR ${type} Report</title>
    <style>
    body{font-family:Arial;padding:20px}
    table{width:100%;border-collapse:collapse}
    th,td{border:1px solid #ccc;padding:8px;text-align:left}
    th{background:#174d7a;color:white}
    .report-head{text-align:center;margin-bottom:20px}
    .meta{display:flex;justify-content:space-between}
    </style></head><body>${element.outerHTML}
    <script>window.onload=function(){window.print()}<\/script>
    </body></html>
  `);
  win.document.close();
}

function saveBlob(blob, filename) {
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  a.click();
  URL.revokeObjectURL(url);
}
</script>
</body>
</html>
