
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>ELK Smart DLR Report Generator</title>

<script src="https://cdnjs.cloudflare.com/ajax/libs/PapaParse/5.4.1/papaparse.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>

<style>
*{box-sizing:border-box}

body{
 margin:0;
 background:#eef2f7;
 color:#172033;
 font-family:Arial,sans-serif;
 padding:20px;
}

.container{max-width:1100px;margin:auto}

h1{font-size:25px;color:#12345a}

.panel{
 background:white;
 padding:20px;
 border-radius:12px;
 margin-bottom:18px;
 box-shadow:0 3px 12px #0000000d;
}

label{
 font-weight:bold;
 display:block;
 margin:12px 0 7px;
}

input,button{
 padding:11px;
 border-radius:7px;
 border:1px solid #ccd5e1;
 font-size:14px;
}

input{width:100%;background:#fff}

button{
 cursor:pointer;
 border:0;
 background:#145da0;
 color:white;
 font-weight:bold;
 margin:5px 5px 5px 0;
}

button:hover{opacity:.88}
button:disabled{opacity:.4;cursor:not-allowed}

.secondary{background:#475569}
.green{background:#15803d}
.orange{background:#c76b10}

.uploads{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:15px;
}

.upload-card{
 border:1px solid #dbe3ed;
 padding:15px;
 border-radius:9px;
}

.report{
 background:#fff;
 padding:25px;
 border-radius:10px;
 margin-top:20px;
}

.report-header{
 border-bottom:2px solid #174b7a;
 padding-bottom:14px;
 margin-bottom:18px;
}

.report-logo{
 max-height:65px;
 max-width:180px;
 object-fit:contain;
}

.report-title{
 font-size:23px;
 font-weight:bold;
 color:#174b7a;
 margin:10px 0;
}

.meta{
 font-size:13px;
 color:#475569;
 margin:5px 0;
}

.status-box{
 background:#fff7ed;
 border-left:5px solid #ea580c;
 padding:12px 15px;
 margin:15px 0;
 border-radius:5px;
}

.status-box.good{
 background:#f0fdf4;
 border-color:#16a34a;
}

.status-box.warning{
 background:#f8fafc;
 border-color:#64748b;
}

.status-label{
 font-size:12px;
 font-weight:bold;
 color:#475569;
 margin-bottom:8px;
}

.status-code{
 font-size:17px;
 font-weight:bold;
 color:#b45309;
}

.status-count{
 font-size:23px;
 font-weight:bold;
 color:#b45309;
}

.status-note{
 font-size:12px;
 color:#64748b;
 margin-top:5px;
}

table{
 width:100%;
 border-collapse:collapse;
 margin-top:12px;
}

th,td{
 border:1px solid #dbe2ea;
 padding:10px;
 text-align:left;
 font-size:13px;
}

th{
 background:#174b7a;
 color:white;
}

td:last-child,th:last-child{text-align:right}

tr:nth-child(even){background:#f8fafc}

.section-title{
 font-size:19px;
 color:#174b7a;
 margin:0 0 5px;
}

.actions{margin:15px 0}

/* LIVE CLOCK */

.live-clock{
 background:linear-gradient(135deg,#12345a,#1769aa);
 color:white;
 padding:18px;
 border-radius:12px;
 margin:15px 0 20px;
 box-shadow:0 4px 14px #00000018;
}

.clock-heading{
 font-size:16px;
 font-weight:bold;
 margin-bottom:5px;
}

.clock-date{
 font-size:13px;
 opacity:.85;
 margin-bottom:15px;
}

.clock-grid{
 display:grid;
 grid-template-columns:1fr 1fr;
 gap:12px;
}

.clock-item{
 background:#ffffff18;
 border:1px solid #ffffff35;
 border-radius:9px;
 padding:13px;
}

.clock-label{
 font-size:12px;
 opacity:.85;
 margin-bottom:7px;
}

.clock-time{
 font-size:25px;
 font-weight:bold;
 font-variant-numeric:tabular-nums;
}

.clock-zone{
 font-size:11px;
 opacity:.8;
 margin-top:5px;
}

@media(max-width:700px){
 body{padding:10px}
 .uploads{grid-template-columns:1fr}
 .report{padding:13px}
 th,td{padding:7px;font-size:12px}
}

@media(max-width:500px){
 .clock-time{font-size:19px}
}
</style>
</head>

<body>

<div class="container">

<h1>ELK Smart DLR Report Generator</h1>

<!-- DHAKA LIVE CLOCK -->

<div class="live-clock">

 <div class="clock-heading">📍 Dhaka, Bangladesh</div>

 <div class="clock-date" id="dhakaDate">
  Loading date...
 </div>

 <div class="clock-grid">

  <div class="clock-item">
   <div class="clock-label">12-HOUR CLOCK</div>
   <div class="clock-time" id="clock12">--:--:-- --</div>
   <div class="clock-zone">AM / PM</div>
  </div>

  <div class="clock-item">
   <div class="clock-label">24-HOUR CLOCK</div>
   <div class="clock-time" id="clock24">--:--:--</div>
   <div class="clock-zone">Bangladesh Time (UTC+6)</div>
  </div>

 </div>
</div>

<!-- INPUT PANEL -->

<div class="panel">

 <label>Reporter Name</label>

 <input
  id="reporter"
  list="reporterNames"
  placeholder="Search or enter reporter name"
 >

 <datalist id="reporterNames"></datalist>

 <label>Upload Company Logo (Optional)</label>

 <input type="file" id="logoInput" accept="image/*">

 <div class="uploads" style="margin-top:20px">

  <div class="upload-card">
   <h3>DLR MNO CSV</h3>
   <input type="file" id="mnoFile" accept=".csv">
   <p id="mnoFileName" class="meta">No file selected</p>
  </div>

  <div class="upload-card">
   <h3>DLR IPTSP CSV</h3>
   <input type="file" id="iptspFile" accept=".csv">
   <p id="iptspFileName" class="meta">No file selected</p>
  </div>

 </div>

 <div class="actions">
  <button onclick="generate()">Generate Report</button>
  <button class="secondary" onclick="resetAll()">Reset</button>
 </div>

</div>

<!-- DOWNLOAD PANEL -->

<div class="panel">

 <h3>Download Report</h3>

 <button class="green" id="pngBtn" onclick="downloadImage('png')" disabled>
  Download PNG
 </button>

 <button class="green" id="jpgBtn" onclick="downloadImage('jpeg')" disabled>
  Download JPG
 </button>

 <button class="orange" id="screenBtn" onclick="openScreenshot()" disabled>
  Screenshot
 </button>

 <button class="secondary" id="mnoCsvBtn" onclick="downloadCSV('MNO')" disabled>
  MNO CSV
 </button>

 <button class="secondary" id="iptspCsvBtn" onclick="downloadCSV('IPTSP')" disabled>
  IPTSP CSV
 </button>

</div>

<!-- REPORT AREA -->

<div id="report" class="report" style="display:none"></div>

</div>

<script>

/* ===============================
   GLOBAL DATA
================================ */

let data={
 MNO:[],
 IPTSP:[]
};

let reportNames={
 MNO:"",
 IPTSP:""
};

let reportTimes={
 MNO:null,
 IPTSP:null
};

let logoData="";

const $=id=>document.getElementById(id);


/* ===============================
   DHAKA LIVE CLOCK
================================ */

function updateDhakaClock(){

 const now=new Date();

 const dateOptions={
  timeZone:"Asia/Dhaka",
  weekday:"long",
  day:"2-digit",
  month:"long",
  year:"numeric"
 };

 const time12Options={
  timeZone:"Asia/Dhaka",
  hour:"2-digit",
  minute:"2-digit",
  second:"2-digit",
  hour12:true
 };

 const time24Options={
  timeZone:"Asia/Dhaka",
  hour:"2-digit",
  minute:"2-digit",
  second:"2-digit",
  hour12:false
 };

 $("dhakaDate").textContent=
  new Intl.DateTimeFormat("en-US",dateOptions).format(now);

 $("clock12").textContent=
  new Intl.DateTimeFormat("en-US",time12Options).format(now);

 $("clock24").textContent=
  new Intl.DateTimeFormat("en-GB",time24Options).format(now);
}

updateDhakaClock();

setInterval(updateDhakaClock,1000);


/* ===============================
   REPORTER NAME SAVE
================================ */

function loadReporterNames(){

 const names=JSON.parse(
  localStorage.getItem("elkReporterNames")||"[]"
 );

 $("reporterNames").innerHTML="";

 names.sort().forEach(name=>{

  const option=document.createElement("option");

  option.value=name;

  $("reporterNames").appendChild(option);

 });
}

function saveReporterName(){

 const name=$("reporter").value.trim();

 if(!name)return;

 let names=JSON.parse(
  localStorage.getItem("elkReporterNames")||"[]"
 );

 if(!names.some(n=>n.toLowerCase()===name.toLowerCase())){

  names.push(name);

  localStorage.setItem(
   "elkReporterNames",
   JSON.stringify(names)
  );
 }

 loadReporterNames();
}

$("reporter").addEventListener("change",saveReporterName);
$("reporter").addEventListener("blur",saveReporterName);


/* ===============================
   CSV FIELD HELPERS
================================ */

function normKey(k){

 return String(k||"")
  .toLowerCase()
  .replace(/[^a-z0-9]/g,"");
}

function field(row,keys){

 const rowKeys=Object.keys(row);

 for(const wanted of keys){

  const found=rowKeys.find(
   k=>normKey(k)===normKey(wanted)
  );

  if(
   found!==undefined &&
   row[found]!==null &&
   row[found]!==undefined &&
   String(row[found]).trim()!==""
  ){

   return row[found];

  }
 }

 return "";
}

function getStatus(row){

 return String(field(row,[
  "status",
  "statusCode",
  "status_code",
  "errorCode",
  "error_code",
  "responseCode",
  "response_code",
  "mnoResponseCode",
  "code"
 ])).trim();
}

function getDescription(row){

 return String(field(row,[
  "description",
  "errorDescription",
  "error_description",
  "statusDescription",
  "status_description",
  "message",
  "errorMessage",
  "error_message"
 ])).trim()||"N/A";
}

function getTimestamp(row){

 return field(row,[
  "@timestamp",
  "timestamp",
  "time",
  "datetime",
  "createdAt",
  "eventTime",
  "event_time"
 ]);
}

function validDate(value){

 if(value===null||value===undefined||value==="")return null;

 let d=new Date(value);

 return isNaN(d.getTime())?null:d;
}


/* ===============================
   DATE FORMAT
================================ */

function formatDate(d){

 const months=[
  "Jan","Feb","Mar","Apr","May","Jun",
  "Jul","Aug","Sep","Oct","Nov","Dec"
 ];

 const pad=n=>String(n).padStart(2,"0");

 return months[d.getMonth()]+" "+
  pad(d.getDate())+", "+
  d.getFullYear()+" @ "+
  pad(d.getHours())+":"+
  pad(d.getMinutes())+":"+
  pad(d.getSeconds())+"."+
  String(d.getMilliseconds()).padStart(3,"0");
}


/* ===============================
   CSV PARSING
================================ */

function parseFile(file,type){

 return new Promise((resolve,reject)=>{

  Papa.parse(file,{

   header:true,
   skipEmptyLines:true,

   complete:function(result){

    if(!result.data||!result.data.length){

     reject(new Error("CSV file is empty"));

     return;
    }

    const rows=result.data.filter(
     r=>getStatus(r)!==""
    );

    if(!rows.length){

     reject(new Error(
      "Status Code column not found or empty"
     ));

     return;
    }

    const dates=rows
     .map(r=>validDate(getTimestamp(r)))
     .filter(d=>d!==null)
     .sort((a,b)=>a-b);

    data[type]=rows;

    reportNames[type]=file.name.replace(/\.csv$/i,"");

    reportTimes[type]=dates.length?
     {
      start:dates[0],
      end:dates[dates.length-1]
     }:null;

    resolve();

   },

   error:reject

  });

 });

}


/* ===============================
   SUMMARY
================================ */

function summarize(rows){

 const map={};

 rows.forEach(row=>{

  const code=getStatus(row);

  const desc=getDescription(row);

  const key=code+"|||"+desc;

  if(!map[key]){

   map[key]={
    code:code,
    description:desc,
    count:0
   };

  }

  map[key].count++;

 });

 return Object.values(map).sort(
  (a,b)=>b.count-a.count
 );

}


/* ===============================
   REPORT STATUS
   COMPARE WITH SUCCESS 1000
================================ */

function getReportStatus(rows){

 const byCode={};

 rows.forEach(row=>{

  const code=getStatus(row);

  if(!code)return;

  byCode[code]=(byCode[code]||0)+1;

 });

 if(!Object.prototype.hasOwnProperty.call(byCode,"1000")){

  return {
   type:"warning",
   message:"Success Code 1000 not found. Comparison unavailable."
  };

 }

 const successCount=byCode["1000"];

 const errors=Object.entries(byCode)

  .filter(([code,count])=>
   code!=="1000"&&count>successCount
  )

  .sort((a,b)=>b[1]-a[1]);

 if(!errors.length){

  return {
   type:"good",
   message:"No Error Code exceeds Success Code 1000.",
   successCount:successCount
  };

 }

 const [code,count]=errors[0];

 const descriptionRow=rows.find(
  r=>getStatus(r)===code
 );

 return {

  type:"error",

  code:code,

  count:count,

  description:descriptionRow?
   getDescription(descriptionRow):"N/A",

  successCount:successCount

 };

}


/* ===============================
   ESCAPE HTML
================================ */

function esc(value){

 return String(value??"").replace(/[&<>"']/g,c=>({

  "&":"&amp;",
  "<":"&lt;",
  ">":"&gt;",
  '"':"&quot;",
  "'":"&#39;"

 }[c]));

}


/* ===============================
   REPORT SECTION
================================ */

function makeSection(type){

 const rows=data[type];

 if(!rows.length)return "";

 const summary=summarize(rows);

 const status=getReportStatus(rows);

 const time=reportTimes[type];

 const timeText=time?

  formatDate(time.start)+" - "+formatDate(time.end):

  "Timestamp not found";

 let statusHTML="";

 if(status.type==="error"){

  statusHTML=`

   <div class="status-box">

    <div class="status-label">
     REPORT STATUS
    </div>

    <div class="status-code">
     Error Code: ${esc(status.code)} — ${esc(status.description)}
    </div>

    <div class="status-count">
     ${status.count.toLocaleString()}
    </div>

    <div class="status-note">
     Highest Error Count | Success Code 1000:
     ${status.successCount.toLocaleString()}
    </div>

   </div>

  `;

 }else if(status.type==="good"){

  statusHTML=`

   <div class="status-box good">

    <div class="status-label">
     REPORT STATUS
    </div>

    <b>${esc(status.message)}</b>

    <div class="status-note">
     Success Code 1000 Count:
     ${status.successCount.toLocaleString()}
    </div>

   </div>

  `;

 }else{

  statusHTML=`

   <div class="status-box warning">

    <div class="status-label">
     REPORT STATUS
    </div>

    <b>${esc(status.message)}</b>

   </div>

  `;

 }

 return `

 <div style="margin-bottom:30px">

  <h2 class="section-title">
   ${esc(reportNames[type])}
  </h2>

  <div class="meta">
   <b>Report Type:</b> DLR ${type}
  </div>

  <div class="meta">
   <b>Reporter:</b>
   ${esc($("reporter").value.trim()||"N/A")}
  </div>

  <div class="meta">
   <b>Time:</b> ${esc(timeText)}
  </div>

  ${statusHTML}

  <table>

   <thead>

    <tr>
     <th>Status Code</th>
     <th>Description</th>
     <th>Count</th>
    </tr>

   </thead>

   <tbody>

    ${summary.map(item=>`

     <tr>

      <td>${esc(item.code)}</td>

      <td>${esc(item.description)}</td>

      <td>${item.count.toLocaleString()}</td>

     </tr>

    `).join("")}

   </tbody>

  </table>

 </div>

 `;

}


/* ===============================
   GENERATE REPORT
================================ */

async function generate(){

 try{

  saveReporterName();

  const mno=$("mnoFile").files[0];

  const iptsp=$("iptspFile").files[0];

  if(!mno&&!iptsp){

   alert("Please upload at least one CSV file.");

   return;
  }

  data={
   MNO:[],
   IPTSP:[]
  };

  reportNames={
   MNO:"",
   IPTSP:""
  };

  reportTimes={
   MNO:null,
   IPTSP:null
  };

  if(mno){

   await parseFile(mno,"MNO");

  }

  if(iptsp){

   await parseFile(iptsp,"IPTSP");

  }

  render();

  ["pngBtn","jpgBtn","screenBtn"].forEach(
   id=>$(id).disabled=false
  );

  $("mnoCsvBtn").disabled=!data.MNO.length;

  $("iptspCsvBtn").disabled=!data.IPTSP.length;

 }catch(error){

  alert("Error: "+error.message);

 }

}


/* ===============================
   RENDER REPORT
================================ */

function render(){

 let html="";

 if(logoData){

  html+=`

   <div style="margin-bottom:15px">

    <img class="report-logo" src="${logoData}">

   </div>

  `;

 }

 if(data.MNO.length){

  html+=makeSection("MNO");

 }

 if(data.IPTSP.length){

  html+=makeSection("IPTSP");

 }

 $("report").innerHTML=html;

 $("report").style.display="block";

 window.scrollTo({
  top:$("report").offsetTop-15,
  behavior:"smooth"
 });

}


/* ===============================
   LOGO UPLOAD
================================ */

$("logoInput").addEventListener("change",function(e){

 const file=e.target.files[0];

 if(!file)return;

 const reader=new FileReader();

 reader.onload=()=>{

  logoData=reader.result;

 };

 reader.readAsDataURL(file);

});


/* ===============================
   FILE NAME DISPLAY
================================ */

$("mnoFile").addEventListener("change",function(){

 $("mnoFileName").textContent=
  this.files[0]?.name||"No file selected";

});

$("iptspFile").addEventListener("change",function(){

 $("iptspFileName").textContent=
  this.files[0]?.name||"No file selected";

});


/* ===============================
   PNG / JPG DOWNLOAD
================================ */

async function downloadImage(format){

 const report=$("report");

 if(!report.innerHTML)return;

 const canvas=await html2canvas(report,{

  scale:2,

  backgroundColor:"#ffffff",

  useCORS:true

 });

 const link=document.createElement("a");

 link.download="ELK_DLR_Report."+
  (format==="jpeg"?"jpg":"png");

 link.href=canvas.toDataURL(
  "image/"+format,
  0.95
 );

 link.click();

}


/* ===============================
   SCREENSHOT
================================ */

async function openScreenshot(){

 const canvas=await html2canvas($("report"),{

  scale:2,

  backgroundColor:"#ffffff",

  useCORS:true

 });

 const image=canvas.toDataURL("image/png");

 const win=window.open();

 if(win){

  win.document.write(`

   <html>

   <head>
    <title>DLR Report Screenshot</title>
   </head>

   <body style="margin:0;text-align:center;background:#eee">

    <img src="${image}" style="max-width:100%;height:auto">

   </body>

   </html>

  `);

  win.document.close();

 }else{

  alert("Please allow pop-ups for this website.");

 }

}


/* ===============================
   CSV DOWNLOAD
================================ */

function downloadCSV(type){

 if(!data[type].length)return;

 const summary=summarize(data[type]);

 const csv=Papa.unparse(

  summary.map(item=>({

   "Status Code":item.code,

   "Description":item.description,

   "Count":item.count

  }))

 );

 const blob=new Blob(

  ["\uFEFF"+csv],

  {type:"text/csv;charset=utf-8;"}

 );

 const url=URL.createObjectURL(blob);

 const link=document.createElement("a");

 link.href=url;

 link.download=
  (reportNames[type]||"DLR_"+type)+
  "_Summary.csv";

 link.click();

 URL.revokeObjectURL(url);

}


/* ===============================
   RESET
================================ */

function resetAll(){

 data={
  MNO:[],
  IPTSP:[]
 };

 reportNames={
  MNO:"",
  IPTSP:""
 };

 reportTimes={
  MNO:null,
  IPTSP:null
 };

 logoData="";

 [
  "mnoFile",
  "iptspFile",
  "logoInput"
 ].forEach(id=>$(id).value="");

 $("mnoFileName").textContent="No file selected";

 $("iptspFileName").textContent="No file selected";

 $("report").innerHTML="";

 $("report").style.display="none";

 [
  "pngBtn",
  "jpgBtn",
  "screenBtn",
  "mnoCsvBtn",
  "iptspCsvBtn"
 ].forEach(id=>$(id).disabled=true);

}


/* ===============================
   INITIALIZE
================================ */

loadReporterNames();

</script>

</body>
</html>
